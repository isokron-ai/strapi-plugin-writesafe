name: Publish to npm

# Manual only. Publishes app/src/plugins/writesafe as strapi-plugin-writesafe-mcp from the PUBLIC plugin repository
# (isokron-ai/strapi-plugin-writesafe), with npm Trusted Publishing: the job's GitHub OIDC token is exchanged for a
# short-lived publish credential, so no npm token is stored anywhere (no NPM_TOKEN secret). Provenance is attached
# for a public package published this way from a public repository.
#
# npm side (once, by the package owner): npmjs.com > strapi-plugin-writesafe-mcp > Settings > Trusted Publisher >
# GitHub Actions: organization isokron-ai, repository strapi-plugin-writesafe, workflow publish.yml, environment
# npm. Then Publishing access: "Require two-factor authentication and disallow tokens" (trusted publishers keep
# working). GitHub side: the environment npm in the public repository (required reviewer: the owner; deployment branch main).
#
# Two jobs: `check` (guards, unit tests, package checks, `npm publish --dry-run`) needs no approval and runs on every
# dispatch; `publish` runs only when dry_run is false, in the npm environment (approval), with id-token: write.
# Requirements (npm docs): npm CLI 11.5.1 or later and Node 22.14.0 or later, on a GitHub-hosted runner.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish; must equal package.json version (a guard against publishing the wrong build)'
        required: true
      dry_run:
        description: 'Dry run (npm publish --dry-run; nothing leaves the runner)'
        type: boolean
        default: true
      dist_tag:
        description: 'npm dist-tag'
        required: false
        default: 'latest'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Guards, tests and dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read     # the guard checks that CI passed on this commit
    defaults:
      run:
        working-directory: app/src/plugins/writesafe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guards
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          DIST_TAG: ${{ github.event.inputs.dist_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # a dist-tag is a plain name: an empty value or one like --registry=... would be read as an npm option
          [[ "$DIST_TAG" =~ ^[a-z][a-z0-9._-]*$ ]] || { echo "::error::bad dist_tag"; exit 1; }
          PKG_VERSION=$(node -p 'require("./package.json").version')
          [ "$PKG_VERSION" = "$INPUT_VERSION" ] || { echo "::error::package.json is $PKG_VERSION, input is $INPUT_VERSION"; exit 1; }
          case "$GITHUB_REF" in refs/heads/main|refs/tags/v*) ;; *) [ "$DRY_RUN" = true ] || { echo "::error::real publishes only from main or a v* tag (ref: $GITHUB_REF)"; exit 1; } ;; esac
          case "$GITHUB_REF" in refs/tags/*) [ "$GITHUB_REF_NAME" = "v$PKG_VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME does not match v$PKG_VERSION"; exit 1; } ;; esac
          case "$PKG_VERSION" in *-*) [ "$DIST_TAG" != latest ] || { echo "::error::prerelease $PKG_VERSION must not go out as dist-tag latest"; exit 1; } ;; esac
          if [ "$DRY_RUN" != true ]; then
            CI_OK=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count' 2>/dev/null || echo 0)
            [ "$CI_OK" != 0 ] || { echo "::error::no successful CI run (ci.yml) for $GITHUB_SHA"; exit 1; }
            # trusted publishing (and its provenance) works from the public repository only
            [ "$REPO_PRIVATE" != true ] || { echo "::error::publish from the public plugin repository (isokron-ai/strapi-plugin-writesafe)"; exit 1; }
          fi
          # a version already on npm stops a real publish; a dry run only warns, so the workflow can be checked on the
          # released commit (npm publish --dry-run sends nothing)
          if npm view "strapi-plugin-writesafe-mcp@$PKG_VERSION" version >/dev/null 2>&1; then
            if [ "$DRY_RUN" = true ]; then echo "::warning::$PKG_VERSION is already on npm (dry run: continuing)"; else echo "::error::$PKG_VERSION is already on npm"; exit 1; fi
          fi
          echo "strapi-plugin-writesafe-mcp@$PKG_VERSION, dist-tag $DIST_TAG (dry run: $DRY_RUN)"
      # the unit tests load @strapi/utils, zod and file-type from the test app, and the stale form tests open SQLite
      # through knex (as in ci.yml): install the app without scripts, then build only the SQLite driver
      - name: Install the test app's dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund --ignore-scripts --loglevel=error
      - name: Build the SQLite driver for the unit tests
        working-directory: app
        run: npm rebuild better-sqlite3 --loglevel=error
      - name: Unit tests
        run: node --test test/*.test.js
      - name: Package checks
        working-directory: .
        run: |
          python3 scripts/scan_secrets.py
          node ci/check_pack.mjs
      # npm 10 (bundled with Node 22) here: its dry run of a version already on npm lists the files and exits 0, so the
      # workflow can be checked on a released commit (1.0.0). npm 11 would exit 1 ("cannot publish over previously
      # published versions"), so do not upgrade npm in this job.
      - name: Dry run (what would be published)
        env:
          DIST_TAG: ${{ github.event.inputs.dist_tag }}
        run: npm publish --dry-run --access public --tag "$DIST_TAG"

  publish:
    name: Publish (trusted publishing)
    needs: check
    if: ${{ github.event.inputs.dry_run == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # the npm Trusted Publisher entry names this environment; it also holds the owner's approval
    environment: npm
    permissions:
      contents: read
      id-token: write   # the OIDC token npm exchanges for a short-lived publish credential (and signs provenance with)
    defaults:
      run:
        working-directory: app/src/plugins/writesafe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # no registry-url: setup-node would write an .npmrc with a placeholder token, and a failed OIDC exchange would
      # then show as a 401/404 on that token instead of npm's ENEEDAUTH
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10
      - name: npm 11
        run: npm install -g npm@^11.5.1 --no-audit --no-fund --loglevel=error && npm --version
      - name: Publish
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          DIST_TAG: ${{ github.event.inputs.dist_tag }}
        run: |
          [[ "$DIST_TAG" =~ ^[a-z][a-z0-9._-]*$ ]] || { echo "::error::bad dist_tag"; exit 1; }
          [ "$(node -p 'require("./package.json").version')" = "$INPUT_VERSION" ] || { echo "::error::package.json does not match the input version"; exit 1; }
          npm publish --provenance --access public --tag "$DIST_TAG"
