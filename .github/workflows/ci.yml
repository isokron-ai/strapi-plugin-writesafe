name: CI

# Per change (every push to main and every pull request): unit tests and packaging checks, then every functional suite
# with every module on (core, media, l10n/history, bulk; ci/run_suite.sh) on three Strapi versions x SQLite,
# Postgres 16 and MySQL 8.4, one parallel job per cell (9 cells). The three versions: the oldest and the newest in
# ci/strapi-versions.json, and PER_CHANGE_MIDDLE (5.51.2: the minor whose per-request memory growth makes it the
# heaviest cell). Every version in ci/strapi-versions.json runs in full-grid.yml (nightly, v* tags, manual).

on:
  # `paths` with negations (paths-ignore takes no `!`): skip markdown-only and results-only changes, except the plugin
  # README, which ships in the package. Later patterns win.
  push:
    branches: [main]
    paths: ['**', '!**.md', '!tests/results/**', 'app/src/plugins/writesafe/README.md']
  pull_request:
    paths: ['**', '!**.md', '!tests/results/**', 'app/src/plugins/writesafe/README.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  STRAPI_TELEMETRY_DISABLED: 'true'
  DO_NOT_TRACK: '1'
  PER_CHANGE_MIDDLE: '5.51.2'

jobs:
  unit:
    name: Unit tests and package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Secret scan
        run: python3 scripts/scan_secrets.py
      - name: Install the test app's dependencies (the unit tests load @strapi/utils, zod, file-type)
        working-directory: app
        run: npm ci --no-audit --no-fund --ignore-scripts --loglevel=error
      - name: Unit tests (node --test)
        working-directory: app/src/plugins/writesafe
        run: node --test test/*.test.js
      - name: Package contents (npm pack --dry-run)
        run: node ci/check_pack.mjs
      - name: Strapi plugin SDK verify
        run: |
          mkdir -p "$RUNNER_TEMP/pkg" && cd app/src/plugins/writesafe && npm pack --silent --pack-destination "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP/pkg" && tar xzf ./*.tgz && cd package && npx -y @strapi/sdk-plugin@6.1.1 verify
      - id: versions
        name: Versions to test (oldest, middle, newest)
        run: |
          V=$(node -e '
            const v = require("./ci/strapi-versions.json").versions;
            const mid = v.includes(process.env.MIDDLE) ? process.env.MIDDLE : v[Math.floor(v.length / 2)];
            console.log(JSON.stringify([...new Set([v[0], mid, v[v.length - 1]])]));')
          echo "versions=$V" >> "$GITHUB_OUTPUT"
          echo "Strapi versions: $V"
        env:
          MIDDLE: ${{ env.PER_CHANGE_MIDDLE }}

  functional:
    name: Strapi ${{ matrix.strapi }} / ${{ matrix.db }}
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        strapi: ${{ fromJSON(needs.unit.outputs.versions) }}
        db: [sqlite, postgres, mysql]
    # both database services start in every cell (simpler than per-cell service definitions); a cell uses only its own
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # throwaway, per run; the container only lives for this job
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-pg
          POSTGRES_DB: strapi
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-my
          MYSQL_DATABASE: strapi
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node${{ env.NODE_VERSION }}-strapi-${{ matrix.strapi }}-${{ hashFiles('app/package.json', 'ci/strapi-versions.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node${{ env.NODE_VERSION }}-strapi-${{ matrix.strapi }}-
            npm-${{ runner.os }}-node${{ env.NODE_VERSION }}-strapi-
      - name: Prepare test app (Strapi ${{ matrix.strapi }}, plugin from npm pack)
        env:
          STRAPI_VER: ${{ matrix.strapi }}
        run: ci/prepare_app.sh "$STRAPI_VER" "$RUNNER_TEMP/app"
      - name: Functional suite on ${{ matrix.db }}
        env:
          DBS: ${{ matrix.db }}
          PG_PORT: '5432'
          PG_USER: postgres
          PG_CONTAINER: ${{ job.services.postgres.id }}
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: ci/run_cell.sh "$RUNNER_TEMP/app" "$RUNNER_TEMP/results"
      - name: Cell summary
        if: always()
        env:
          STRAPI_VER: ${{ matrix.strapi }}
          DB: ${{ matrix.db }}
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          # a version that did not install still gets a row (FAIL (prepare)) in the matrix table
          if [ ! -f "$RUNNER_TEMP/app/.strapi-version" ]; then echo "rc=5 prepare failed" > "$RUNNER_TEMP/results/$STRAPI_VER-$DB.status"; fi
          cp "$RUNNER_TEMP/app/resolved-package-lock.json" "$RUNNER_TEMP/results/" 2>/dev/null || true
          python3 ci/matrix_report.py "$RUNNER_TEMP/results" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.strapi }}-${{ matrix.db }}
          path: |
            ${{ runner.temp }}/results/*.status
            ${{ runner.temp }}/results/*.json
            ${{ runner.temp }}/results/*.txt
            ${{ runner.temp }}/results/work-*/strapi-*.log
            ${{ runner.temp }}/results/work-*/suite-*.txt
          retention-days: 30
          if-no-files-found: warn

  report:
    name: Matrix report
    needs: functional
    if: always() && needs.functional.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
      - name: Version x database table
        run: |
          python3 ci/matrix_report.py results matrix.md
          cat matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-report
          path: matrix.md
